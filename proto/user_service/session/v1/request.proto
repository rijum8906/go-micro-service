syntax = "proto3";

package user_service.session.v1;

import "core/v1/common.proto";

message GetActiveSessionsRequest {
  string user_id = 1;
}

message GetSessions {
  string user_id = 1;
  core.v1.PaginationRequest page = 2;
}

message RevokeSession {
  string scoped_token = 1;
  string session_id = 2;
}
