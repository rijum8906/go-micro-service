syntax = "proto3";

package user_service.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rijum8906/relay/proto/user_service/v1;userservice";

// Account represents a user account
message Account {
  string id = 1;
  string email = 2;
  bool email_verified = 3;
  bool two_factor_enabled = 4;
  string role = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp last_login_at = 8;
}

// Profile represents a user profile
message Profile {
  string id = 1;
  string account_id = 2;
  string first_name = 3;
  string last_name = 4;
  optional string display_name = 5;
  optional string avatar_url = 6;
  optional string bio = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Session represents a user session
message Session {
  string id = 1;
  string account_id = 2;
  string device_id = 3;
  string device_type = 4;
  string ip_address = 5;
  string user_agent = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp last_active_at = 9;
}

// Token pair for authentication
message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
}

// Request/Response messages
message SignupRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  common.v1.RequestMetadata metadata = 5;
}

message SigninRequest {
  string email = 1;
  string password = 2;
  optional string two_factor_code = 3;
  common.v1.RequestMetadata metadata = 4;
}

message AuthResponse {
  Account account = 1;
  repeated Profile profiles = 2;
  TokenPair tokens = 3;
}

message SignoutRequest {
  common.v1.RequestMetadata metadata = 1;
}

message SignoutResponse {
  bool success = 1;
}
