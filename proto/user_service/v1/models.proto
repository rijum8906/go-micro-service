syntax = "proto3";

package user_service.v1;

import "buf/validate/validate.proto";
import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/rijum8906/relay/proto/user_service/v1;userservice";

message AuthTokens {
  common.v1.Token access_token = 1 [(buf.validate.field).required = true];
  common.v1.Token refresh_token = 2 [(buf.validate.field).required = true];
}

// Account mirrors the safe public subset of the generated db.Account model.
message Account {
  common.v1.UUID id = 1 [(buf.validate.field).required = true];
  common.v1.Email email = 2 [(buf.validate.field).required = true];
  bool is_email_verified = 3;
  optional google.protobuf.Timestamp email_verified_at = 4;
  bool two_factor_enabled = 5;
  optional google.protobuf.Timestamp two_factor_enabled_at = 6;
  google.protobuf.Timestamp created_at = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 8 [(buf.validate.field).required = true];
}

// Profile mirrors the generated db.Profile model.
message Profile {
  common.v1.UUID id = 1 [(buf.validate.field).required = true];
  common.v1.UUID account_id = 2 [(buf.validate.field).required = true];
  common.v1.Name first_name = 3 [(buf.validate.field).required = true];
  common.v1.Name last_name = 4 [(buf.validate.field).required = true];
  optional common.v1.Name display_name = 5;
  optional common.v1.Url avatar_url = 6;
  google.protobuf.Timestamp created_at = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 8 [(buf.validate.field).required = true];
}

// Session mirrors the generated db.Session model.
message Session {
  common.v1.UUID id = 1 [(buf.validate.field).required = true];
  common.v1.UUID account_id = 2 [(buf.validate.field).required = true];
  common.v1.String device_id = 3 [(buf.validate.field).required = true];
  common.v1.String ip_address = 4 [(buf.validate.field).required = true];
  common.v1.String user_agent = 5 [(buf.validate.field).required = true];
  google.protobuf.Timestamp last_login_at = 6 [(buf.validate.field).required = true];
  bool is_revoked = 7;
  google.protobuf.Timestamp expires_at = 8 [(buf.validate.field).required = true];
  google.protobuf.Timestamp created_at = 9 [(buf.validate.field).required = true];
  google.protobuf.Timestamp updated_at = 10 [(buf.validate.field).required = true];
}
