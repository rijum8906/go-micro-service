syntax = "proto3";

package user_service.auth.v1;

import "user_service/models/v1/model.proto";

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message RequestEmailVerificationRequest {
  string email = 1;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message VerifyEmailRequest {
  user_service.models.v1.Token scoped_token = 1;
}

message ResetPasswordRequest {
  user_service.models.v1.Token scoped_token = 1;
  string new_password = 2;
}
