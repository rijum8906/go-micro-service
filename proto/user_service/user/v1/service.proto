syntax = "proto3";

package user_service.user.v1;

import "core/v1/common.proto";
import "user_service/models/v1/model.proto";
import "user_service/user/v1/request.proto";
import "user_service/user/v1/response.proto";

service UserService {
  // Profile management
  rpc GetMyProfile(core.v1.EmptyRequest) returns (user_service.models.v1.Profile);
  rpc UpdateProfileAvatarURL(UpdateProfileAvatarURLRequest) returns (user_service.models.v1.Profile);
  rpc UpdateProfileName(UpdateProfileNameRequest) returns (user_service.models.v1.Profile);

  // User management
  rpc GetMySelf(core.v1.EmptyRequest) returns (user_service.models.v1.User);
  rpc GetUser(core.v1.IDRequest) returns (user_service.models.v1.User);

  // User existence checks
  rpc CheckExists(core.v1.IDRequest) returns (CheckExistsResponse);
  rpc CheckEmailExists(core.v1.EmailRequest) returns (CheckExistsResponse);
}
