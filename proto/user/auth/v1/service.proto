syntax = "proto3";

package user.auth.v1;

import "user/auth/v1/request.proto";
import "user/auth/v1/response.proto";
import "user/models/v1/model.proto";

service AuthService {
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc GenerateScopedToken(GenerateScopedTokenRequest) returns (GenerateScopedTokenResponse);
  rpc UpdateProfileAvatarUrl(UpdateProfileAvatarUrlRequest) returns (user.models.v1.Profile);
  rpc UpdateProfileName(UpdateProfileNameRequest) returns (user.models.v1.Profile);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}
