syntax = "proto3";

package user.auth.v1;

import "user/models/v1/model.proto";

option go_package = "github.com/rijum8906/relay/proto/user/v1/auth;proto_auth";

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
}

message AuthResponse {
  user.models.v1.User user = 1;
  user.models.v1.Profile profile = 2;
  user.models.v1.AuthToken tokens = 3;
}
