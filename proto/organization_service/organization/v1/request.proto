syntax = "proto3";

package organization_service.organization.v1;

message CreateOrganizationRequest {
  string name = 1;
  string description = 2;
  string slug = 3;
  string created_by = 4;
}

message GetOrganizationsByCreatedAtRequest {
  string id = 1;
}

message UpdateOrganizationNameRequest {
  string organization_id = 1;
  string name = 2;
  string description = 3;
}

message GetOrganizationBySlugRequest {
  string slug = 1;
}
