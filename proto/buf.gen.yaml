version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rijum8906/relay/proto/pb

plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/rijum8906/relay
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/rijum8906/relay
