name: Core Package Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

env:
  TEST_DB_URL: "postgres://test_user:test_password@localhost:5433/test_db?sslmode=disable&search_path=public"
  TEST_SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  TEST_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  TEST_SMTP_HOST: ${{ secrets.SMTP_HOST }}
  TEST_SMTP_PORT: ${{ secrets.SMTP_PORT }}

jobs:
  test-core:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Start Test docker-compose
        run: |
          docker compose -f docker-compose.test.yml up -d
          docker compose -f docker-compose.test.yml ps

      - name: Setup Workspace
        run: |
          go install ./rcli
          rcli init project

      - name: Run unit tests
        working-directory: packages/core
        run: go test -v ./... -timeout 30s
