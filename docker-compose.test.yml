services:
  # postgres
  test-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: "test_user"
      POSTGRES_PASSWORD: "test_password"
      POSTGRES_DB: "test_db"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - test-postgres:/var/lib/postgresql/data

  test-redis:
    image: redis:latest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - test-redis:/var/lib/redis/data

  test-nats:
    image: nats:2.12-alpine
    command: ["-js"]
    ports:
      - "4223:4222"
    healthcheck:
      test: ["CMD", "nats-server", "-sl"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - test-nats:/var/lib/nats/data

  test-migrate:
    depends_on:
      test-postgres:
        condition: service_healthy
    image: openfga/openfga:latest
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://test_user:test_password@test-postgres:5432/test_db?sslmode=disable

  test-openfga:
    image: openfga/openfga:latest
    command: run
    ports:
      - "9000:9000"
    depends_on:
      test-postgres:
        condition: service_healthy
      test-migrate:
        condition: service_completed_successfully
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://test_user:test_password@test-postgres:5432/test_db?sslmode=disable
      - OPENFGA_HTTP_ADDR=0.0.0.0:9000
    volumes:
      - test-openfga:/var/lib/openfga/data

volumes:
  test-redis:
  test-postgres:
  test-nats:
  test-openfga:
