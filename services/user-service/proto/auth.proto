syntax = "proto3";

package auth;

option go_package = "github.com/rijum8906/microservices/services/user-service/internal/api/grpc";


message CreateUser {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string password = 4;
}

message CreateUserResponse {
  object account = {

  }
}


service UserService {
  rpc CreateUser(CreateUser) returns (User);
}
