apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: relay
  labels:
    app: redis
spec:
  selector:
    app: redis
  type: ClusterIP
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: relay
  labels:
    app: redis
spec:
  selector:
    matchLabels:
      app: redis
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: redis
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 30 # Increased for graceful shutdown

      containers:
        - name: redis
          image: redis:8.6.1-trixie
          imagePullPolicy: IfNotPresent
          # FIXED: Command syntax and variable expansion
          command:
            - redis-server
              # FIXED: envFrom needs dash and proper indentation

          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 100Mi

          ports:
            - containerPort: 6379
              name: redis

          # FIXED: Probes use $(VAR) syntax
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli ping | grep PONG"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "redis-cli ping | grep PONG"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

          volumeMounts:
            - name: data
              mountPath: /data
              subPath: redis
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true

      volumes:
        - name: localtime
          hostPath:
            path: /usr/share/zoneinfo/Asia/Kolkata
            type: File
        - name: data
          persistentVolumeClaim:
            claimName: redis-pvc

      restartPolicy: Always
---
# Add this PVC if not exists
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: relay
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
