apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: relay
spec:
  ports:
    - port: 8906
      targetPort: 8906
  selector:
    app: user-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: relay
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: fistrax/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8906
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8906
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8906
            initialDelaySeconds: 30
            periodSeconds: 10
