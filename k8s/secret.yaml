apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: go-micro-service
type: Opaque
stringData:
  DB_PASSWORD: "postgres"
  REDIS_PASSWORD: ""
  JWT_SECRET: "replace-with-a-strong-jwt-secret"
  SCOPED_JWT_SECRET: "replace-with-a-strong-scoped-jwt-secret"
  SMTP_PASSWORD: ""
  STORAGE_ACCESS_KEY: "minioadmin"
  STORAGE_SECRET_KEY: "minioadmin"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: go-micro-service
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "postgres"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: go-micro-service
type: Opaque
stringData:
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin"
