# .mockery.yaml - Version 3 compatible

# Global configuration
all: false
dir: "{{.InterfaceDir}}/mocks" # Dynamic directory based on interface location
recursive: true
inpackage: false
pkgname: "{{.SrcPackageName}}_mock"
filename: "mock_{{.InterfaceNameSnake}}.go"
include-auto-generated: true

# Output formatting
formatter: "goimports"

# Package-specific overrides
packages:
  github.com/rijum8906/relay/packages/pb/user_service/user/v1:
    config:
      # Use different output directory for this package
      dir: "./user_service/mocks"

    interfaces:
      # Specific interface configuration
      UserServiceClient:
        config:
          filename: "mock_user_service_client.go"
