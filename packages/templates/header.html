    <title>Account Notification</title>
    <style>
        body {

        }

        table {

        .card-padding {

        .body-copy {

        }

        .token-box {
            padding: 18px 20px;
            background-color: #f8fafc;
            border: 1px solid #dbe4f0;
            border-radius: 12px;
            text-align: center;
        }

        .token-text {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 6px;
            color: #0f172a;
        }

        @media screen and (max-width: 600px) {
            .card-padding {
                padding: 28px 22px 24px !important;
            }

            .token-text {
                font-size: 24px !important;
                letter-spacing: 4px !important;
            }
        }
    </style>
</head>
